<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatGPT Relay</title>
  </head>
  <body>
    <main aria-labelledby="title">
      <h1 id="title">ChatGPT Relay</h1>
      <p id="status" role="status" aria-live="polite" data-state="loading">Loading relay status…</p>
      <p id="error" role="alert" hidden></p>
      <section aria-label="Relay controls">
        <button id="start" type="button" disabled>Start relay</button>
        <button id="stop" type="button" disabled>Stop relay</button>
      </section>
      <form id="preferences-form">
        <label for="max-turns">Maximum turns</label>
        <input id="max-turns" name="maxTurns" type="number" min="1" step="1" value="10" />
        <button id="save-max-turns" type="submit">Save</button>
        <p id="preference-status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
