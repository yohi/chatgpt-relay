<main id="main-thread">
  <section id="transcript">
    <article id="user-turn" data-chatgpt-search-unit-key="fallback-turn-0:0:user" data-chatgpt-search-message-ids="11111111-1111-4111-8111-111111111111">
      <div data-user-message-bubble>synthetic user fixture</div>
      <button id="edit-control" aria-label="メッセージを編集"></button>
    </article>
    <article id="assistant-turn" data-chatgpt-search-unit-key="fallback-turn-0:2:assistant" data-chatgpt-search-message-ids="22222222-2222-4222-8222-222222222222 22222222-2222-4222-8222-222222222222" data-chatgpt-selection-message-id="22222222-2222-4222-8222-222222222222">
      <h4 data-conversation-role="assistant">synthetic assistant fixture</h4>
      <button id="regenerate-control" aria-label="回答を再生成"></button>
    </article>
  </section>
  <form id="main-composer" data-chatgpt-composer>
    <div id="main-textbox" role="textbox" contenteditable="true" data-composer-markdown aria-label="ChatGPT に聞く"></div>
    <button id="main-submit" type="submit">送信</button>
  </form>
</main>
<section data-pip-obstacle="quick-chat" data-quick-chat-drag-handle role="dialog">
  <form data-chatgpt-composer>
    <div role="textbox" contenteditable="true" data-composer-markdown></div>
    <button type="submit">Quick Chat</button>
  </form>
</section>
