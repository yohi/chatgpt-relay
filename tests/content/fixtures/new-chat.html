<main id="main-thread">
  <form id="main-composer" data-chatgpt-composer data-conversation-id="local-chatgpt:transient-1">
    <div
      id="main-textbox"
      role="textbox"
      contenteditable="true"
      data-composer-markdown
      aria-label="ChatGPT に聞く"
    ></div>
    <button id="main-submit" type="submit">送信</button>
  </form>
</main>
<section data-pip-obstacle="quick-chat" data-quick-chat-drag-handle role="dialog">
  <form id="quick-chat-composer" data-chatgpt-composer>
    <div role="textbox" contenteditable="true" data-composer-markdown></div>
    <button type="submit">Quick Chat</button>
  </form>
</section>
